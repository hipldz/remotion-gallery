<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11151b" />
    <title>演示录制</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          16px/1.65 system-ui,
          "Noto Sans SC",
          sans-serif;
        background: #11151b;
        color: #edf1f7;
      }
      body {
        margin: 0;
        padding: clamp(24px, 7vw, 80px) 20px;
      }
      main {
        max-width: 660px;
        margin: auto;
        padding: clamp(20px, 4vw, 40px);
        background: #1a2029;
        border: 1px solid #34404e;
        border-radius: 16px;
      }
      h1 {
        font-size: clamp(26px, 4vw, 34px);
        line-height: 1.2;
        margin: 0 0 0.5em;
      }
      p {
        color: #bdc6d3;
        margin: 0 0 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>演示录制</h1>
      <p>
        先打开你的演示。点「开始录制」，选择演示标签页或窗口，允许麦克风后就可以边操作边讲。录完在这里下载视频。
      </p>
      <remotion-recorder></remotion-recorder>
      <noscript>请启用 JavaScript 以使用录制功能。</noscript>
    </main>
    <script src="./recorder.js"></script>
  </body>
</html>
